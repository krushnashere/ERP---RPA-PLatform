# Serves the built React SPA and reverse-proxies the FastAPI backend, so the
# client bundle never contains a backend hostname. `api` is the docker-compose
# service name; on a plain VM change it to 127.0.0.1:8000.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # request attachments can be several MB
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # the backend logs this id on every line; passing it through is what
        # makes a user-reported failure traceable end to end
        proxy_pass_header X-Request-ID;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # Interactive API docs are worth keeping reachable behind the proxy
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames, so these are cacheable forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other path is a client-side route
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
